[package]
name = "termius-export"
version = "0.1.0"
edition = "2021"
description = "Export hosts, credentials and keys from a local Termius install (offline, no account password)."
license = "MIT"

[[bin]]
name = "termius-export"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crypto_secretbox = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[profile.release]
strip = true
